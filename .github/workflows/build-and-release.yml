name: Build and Release Chrome Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Build and zip Chrome extension
        run: npm run zip:chrome

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Delete existing release with same tag (if any)
        continue-on-error: true
        run: gh release delete "v${{ steps.pkg.outputs.version }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --title "DeepSeek++ v${{ steps.pkg.outputs.version }}" \
            --notes "$(cat <<'EOF'
          ## DeepSeek++ v${{ steps.pkg.outputs.version }}

          Built automatically from commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          ### Installazione
          1. Scarica il file `.zip` qui sotto
          2. Estrai in una cartella
          3. Apri Chrome → `chrome://extensions` → **Modalità sviluppatore** ON
          4. Clicca **"Carica estensione non pacchettizzata"** → seleziona la cartella estratta

          ### Credits
          - Fork originale: [zhu1090093659/deepseek-pp](https://github.com/zhu1090093659/deepseek-pp)
          - Traduzione IT/EN: Boris Landoni & AI
          EOF
          )" \
            --latest \
            dist/deepseek-plus-plus-${{ steps.pkg.outputs.version }}-chrome.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
